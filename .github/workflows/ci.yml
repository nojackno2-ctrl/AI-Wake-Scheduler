name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Tests must not depend on the machine's time zone (including DST and half-hour offsets).
        timezone:
          - UTC
          - Taipei Standard Time
          - India Standard Time
          - Pacific Standard Time
          - AUS Eastern Standard Time
    name: build-and-test (${{ matrix.timezone }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set time zone
        run: tzutil /s "${{ matrix.timezone }}"
      # Pin the toolchain so a newer clippy cannot turn the lint gate red on its own.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
          rustc --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
