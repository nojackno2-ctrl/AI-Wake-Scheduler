name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Tests must not depend on the machine's time zone (including DST and half-hour offsets).
        timezone:
          - UTC
          - Taipei Standard Time
          - India Standard Time
          - Pacific Standard Time
          - AUS Eastern Standard Time
    name: build-and-test (${{ matrix.timezone }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set time zone
        run: tzutil /s "${{ matrix.timezone }}"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore AI倒數喚醒.sln
      - run: dotnet build AI倒數喚醒.sln -c Release --no-restore
      - name: Core tests
        run: dotnet run --project tests/AiWakeScheduler.Tests -c Release --no-build
      - name: WinForms tests
        run: dotnet run --project tests/AiWakeScheduler.WinForms.Tests -c Release --no-build
