[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "2.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
windows = "0.61"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "clipboard", "default_fonts", "links", "system_fonts"] }
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
